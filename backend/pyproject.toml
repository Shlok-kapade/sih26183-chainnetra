[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chainnetra-backend"
version = "0.1.0"
description = "ChainNetra Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "SQLAlchemy[asyncio]>=2.0.20",
    "asyncpg>=0.28.0",
    "alembic>=1.11.3",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.3",
    "httpx>=0.24.1",
    "tenacity>=8.2.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "networkx>=3.1",
    "shap>=0.42.1",
    "lightgbm>=4.0.0",
    "joblib>=1.3.2",
    "reportlab>=4.0.4",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.0.285",
    "mypy>=1.5.1",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "hypothesis>=6.82.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.24.1"
]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# N806/N803: X, y are standard ML naming conventions (scikit-learn, pandas)
"app/ml/*.py"         = ["N806", "N803"]
"ml/**/*.py"          = ["N806", "N803", "E402", "F841"]
"tests/test_ml.py"    = ["N806", "N803"]
"tests/test_m3.py"    = ["N806", "E731"]
"../scripts/synth_laundering.py" = ["E741"]


[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]
